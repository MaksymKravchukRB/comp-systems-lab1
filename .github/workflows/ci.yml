name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint Shell Scripts
        uses: essentialkaos/shellcheck-action@v1
        with:
          files: setup.sh entrypoint.sh
      - name: Lint YAML Files
        uses: step-security/yamllint-github-action@v3
        with:
          yamllint_file_or_dir: .
          yamllint_comment: true
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check code formatting
        run: dotnet format
          comp-systems-lab1.slnx --verify-no-changes --verbosity minimal

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore comp-systems-lab1.slnx
      - name: Build
        run: dotnet build --no-restore comp-systems-lab1.slnx

      # Run tests with coverage collection
      - name: Test with coverage
        run: |
          dotnet test comp-systems-lab1.slnx \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      # Install reportgenerator
      - name: Install reportgenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # Generate HTML coverage report
      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./CoverageReport \
            -reporttypes:Html

      # Extract line coverage percentage and fail if below 40%
      - name: Check coverage threshold (≥40%)
        run: |
          # Find the cobertura XML file
          COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "Coverage file not found!"
            exit 1
          fi
          # Extract line-rate (e.g., 0.85 = 85%)
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          if [ -z "$LINE_RATE" ]; then
            echo "Could not parse line-rate from coverage file."
            exit 1
          fi
          COVERAGE=$(echo "$LINE_RATE * 100" | bc | cut -d. -f1)
          echo "Line coverage: ${COVERAGE}%"
          if [ "$COVERAGE" -lt 40 ]; then
            echo "❌ Coverage ${COVERAGE}% is below the required 40%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the requirement (≥40%)"

      # Upload coverage report as artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport
