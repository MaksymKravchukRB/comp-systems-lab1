name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # allow manual trigger

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Lint Shell Scripts
        uses: essentialkaos/shellcheck-action@v1
        with:
          files: setup.sh entrypoint.sh
      - name: Lint YAML Files
        uses: step-security/yamllint-github-action@v3
        with:
          yamllint_file_or_dir: .
          yamllint_comment: true
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check code formatting
        run: |
          dotnet format comp-systems-lab1.slnx \
            --verify-no-changes --verbosity minimal

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore comp-systems-lab1.slnx
      - name: Build
        run: dotnet build --no-restore comp-systems-lab1.slnx
      - name: Test with coverage
        run: |
          dotnet test comp-systems-lab1.slnx \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
      - name: Install reportgenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./CoverageReport \
            -reporttypes:Html
      - name: Check coverage threshold (≥40%)
        run: |
          COVERAGE_FILE=$(find ./TestResults -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE_FILE" ]; then
            echo "Coverage file not found!"
            exit 1
          fi
          LINE_RATE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          if [ -z "$LINE_RATE" ]; then
            echo "Could not parse line-rate from coverage file."
            exit 1
          fi
          COVERAGE=$(echo "$LINE_RATE * 100" | bc | cut -d. -f1)
          echo "Line coverage: ${COVERAGE}%"
          if [ "$COVERAGE" -lt 40 ]; then
            echo "❌ Coverage ${COVERAGE}% is below the required 40%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets the requirement (≥40%)"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./CoverageReport

  build-image:
    needs: [lint, build]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Debug event and ref
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tags=ghcr.io/${REPO_LC}:stable" >> $GITHUB_OUTPUT
            echo "tags=ghcr.io/${REPO_LC}:${TAG_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/${REPO_LC}:latest" >> $GITHUB_OUTPUT
            echo "tags=ghcr.io/${REPO_LC}:sha-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
